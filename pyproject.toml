[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-link-cli"
version = "0.1.0"
description = "Lightweight AgentLink CLI & Skill for Zero-Knowledge Autonomous Agent Mesh"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AgentLink Maintainers", email = "maintainers@agentlink.dev" }
]
dependencies = [
    "cryptography>=39.0.0",
    "qrcode>=7.4.2",
]

[project.scripts]
agent-link = "agent_link.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_link"]
